# Fetching all runs to get total mileage
query GetAllRuns {
  runs(orderBy: [{date: DESC}]) {
    id
    date
    distanceMiles
    durationMinutes
  }
}

# Fetching all restaurants for display 
query GetAllRestaurants {
  restaurants {
    id
    name
    cuisine
    milesRequired
    isVisited
  }
}

query GetAllRunsAndRestaurants {
  runs {
    id
    date
    distanceMiles
    durationMinutes
  }
  restaurants {
    id
    name
    cuisine
    milesRequired
    isVisited
  }
}

query GetMileage {
  mileages {
    id
    netMiles
  }
}

##MUTATIONS

#Creating a new run entry
mutation AddRun($date: Date!, $distanceMiles: Float!, $durationMinutes: Int!) {
  run_insert(data:{
    date: $date
    distanceMiles: $distanceMiles 
    durationMinutes: $durationMinutes
})
}
#creating a new restaurant entry
mutation AddRestaurant($name: String!, $cuisine: String!, $milesRequired: Float!) {
  restaurant_insert(data:{
    name: $name
    cuisine: $cuisine
    milesRequired: $milesRequired 
    ##isVisited will default to false
})
}
# Marking a restaurant as visited
mutation MarkRestaurantVisited($id: UUID!) {
  restaurant_update(id: $id, data:{
    isVisited: true
})
}
# Marking a restaurant as not visited
mutation UnmarkRestaurantVisited($id: UUID!) {
  restaurant_update(id: $id, data: {
    isVisited: false
  })
}

mutation deleteRestaurant($id: UUID!) {
  restaurant_delete(id: $id)
}

## Updating mileage after a run is added
mutation UpdateMileageAfterRun($id: UUID!, $netMiles: Float!) {
  mileage_update(id: $id, data: {
    netMiles: $netMiles
  })
} 

## Setting a mileage (at the start up execution):

mutation CreateMileage($netMiles: Float!) {
  mileage_insert(data: { netMiles: $netMiles })
}